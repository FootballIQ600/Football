
name: Update football results

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install pandas requests

      - name: Download football results
        run: python import_results.py

      - name: Save updated CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_results.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update football results"
            git push
          fi
